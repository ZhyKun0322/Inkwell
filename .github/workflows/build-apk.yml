name: Build Inkwell APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Add Android platform
        run: cd apk-project && cordova platform add android

      - name: Add plugins
        run: |
          cd apk-project
          cordova plugin add cordova-plugin-whitelist
          cordova plugin add nodejs-mobile-cordova

      - name: Build debug APK
        run: cd apk-project && cordova build android

      - name: Locate APK
        run: find . -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkwell-apk
          path: apk-project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
